# Netlify-konfiguration för Sommen Hütten-sajten.
# Den här filen ligger i projektmappen. I Netlify sätter du
# "Base directory" = projects/cabins, så läses den här filen och
# command/publish tolkas relativt projektmappen.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-routing: alla vägar serveras av index.html så att t.ex.
# /cabins/seeblick och /angeln fungerar vid direktlänk och omladdning.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

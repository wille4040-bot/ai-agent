# Netlify-konfiguration för Sllr.
# Appen ligger i undermappen projects/sllr, därför sätts "base".
# publish anges relativt base, dvs projects/sllr/dist.

[build]
  base = "projects/sllr"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA-routing: alla vägar serveras av index.html så att t.ex. /annonser/123
# fungerar vid direktlänk och omladdning.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
